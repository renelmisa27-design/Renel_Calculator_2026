<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9aac5a366c.js" crossorigin="anonymous"></script>
    <title>Calculator-2026</title>
</head>

<body>
    <div id="calculator">
        <input type="text" id="display">
        <div class="icons">
        <i class="fa-regular fa-clock"></i>
        <i class="fa-solid fa-ruler-horizontal"></i>
        <i class="fa-solid fa-calendar-week"></i>
        </div>
       <i class="fa-solid fa-delete-left" id="backspace" style="color: white; cursor: pointer;"></i>

        <div class="format">
            <button onclick="clearDisplay()" class="clear-display">C</button>
            <button onclick="appendToDisplay('()')" class="operator-g">( )</button>
            <button onclick="appendToDisplay('%*')"id="modulos" class="operator-g">%</button>
            <button onclick="appendToDisplay('/')" class="operator-g">/</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('*')" class="operator-g">x</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('-')" class="operator-g">-</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('+')" class="operator-g">+</button>

            <button onclick="appendToDisplay('+/-')">+/-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculate()" class="operator-e">=</button>

  
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
